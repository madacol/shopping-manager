<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Lista de compras</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <div class="topbar">
        <a class="back-link" href="./index.html" aria-label="Volver">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </a>
        <div class="title-block">
          <div class="title-row">
            <h1 id="page-title">Lista <span class="title-lock" aria-hidden="true">🔒</span></h1>
            <span class="status" id="sync-status">Sincronizando...</span>
          </div>
        </div>
      </div>

      <div class="progress-track">
        <div id="progress-fill" class="progress-fill" style="width:0%"></div>
      </div>

      <form id="add-form" class="add-bar">
        <input id="item-name" name="item" type="text" autocomplete="off" placeholder="Agregar producto..." required>
        <input id="item-qty" name="qty" type="number" inputmode="decimal" min="0.1" step="0.1" value="1" class="qty-input" required>
        <button type="submit" aria-label="Agregar">+</button>
      </form>

      <div id="pending-section">
        <p class="section-label section-label--pending section-toggle" data-target="pending-items" aria-expanded="true">
          Pendientes <span id="pending-count" class="badge">0</span>
        </p>
        <ul id="pending-items" class="item-list"></ul>
      </div>

      <div id="activity-section">
        <p class="section-label section-label--activity section-toggle" data-target="activity-items" aria-expanded="true">
          Actividad reciente <span id="activity-count" class="badge">0</span>
        </p>
        <ul id="activity-items" class="item-list"></ul>
      </div>
    </main>

    <div id="edit-modal" class="modal-shell" hidden>
      <div class="modal-backdrop" data-action="close-modal"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="modal-header">
          <h2 id="edit-modal-title">Editar item</h2>
          <button type="button" class="modal-close" data-action="close-modal" aria-label="Cerrar">×</button>
        </div>

        <form id="edit-form" class="edit-form">
          <div class="edit-form-top">
            <input id="edit-item-name" name="item" type="text" class="edit-input edit-input--name" placeholder="Producto" required>
            <input id="edit-item-qty" name="qty" type="number" inputmode="decimal" min="0.1" step="0.1" class="edit-input edit-input--qty" required>
          </div>
          <input id="edit-item-note" name="note" type="text" class="edit-input edit-input--note" placeholder="Nota">

          <div class="edit-actions">
            <button type="button" class="edit-action edit-action--ghost" data-action="cancel-edit">Cancelar</button>
            <button type="submit" class="edit-action edit-action--save">Guardar</button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="./list.js"></script>
  </body>
</html>
